name: Orange Client - Windows EXE

on:
  push:
    paths:
      - "OrangeClient-source(2)-GitHub.zip"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: orange-client-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Orange Launcher 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract uploaded source archive
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:GITHUB_WORKSPACE "OrangeClient-source(2)-GitHub.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Missing OrangeClient-source(2)-GitHub.zip. Upload the prepared source ZIP to the repository root first."
          }

          $extract = Join-Path $env:RUNNER_TEMP "orange-client-source"
          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $root = Join-Path $extract "OrangeClient"
          if (-not (Test-Path -LiteralPath (Join-Path $root "Cargo.toml") -PathType Leaf)) {
            throw "The archive does not contain OrangeClient/Cargo.toml."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root "packages/oneclient_app/Cargo.toml") -PathType Leaf)) {
            throw "The archive is missing packages/oneclient_app/Cargo.toml."
          }
          "path=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install NSIS when needed
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            $nsis = "C:\Program Files (x86)\NSIS"
            if (Test-Path "$nsis\makensis.exe") {
              "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }

      - name: Install cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build launcher executable
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: cargo build --release --bin oneclient_app

      - name: Bundle the Microsoft Visual C++ runtime
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: python distribution/windows/bundle-crt.py

      - name: Verify bundled runtime signatures
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dlls = @(Get-ChildItem "target/crt/*.dll")
          if ($dlls.Count -eq 0) { throw "No Microsoft VC++ runtime DLLs were staged." }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
              throw "Refusing to ship an unsigned or non-Microsoft runtime DLL: $($dll.Name)"
            }
          }

      - name: Create Windows installer
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        env:
          CI: "true"
        run: cargo packager --release --formats nsis --verbose

      - name: Prepare downloads and SHA-256
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $app = Join-Path (Get-Location) "target/release/oneclient_app.exe"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "Build did not produce target/release/oneclient_app.exe."
          }
          Copy-Item -LiteralPath $app -Destination (Join-Path $dist "Orange-Client-Portable.exe")

          $setup = Get-ChildItem "target/release/*setup.exe" -File | Select-Object -First 1
          if ($null -eq $setup) {
            $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" -File | Select-Object -First 1
          }
          if ($null -eq $setup) { throw "cargo-packager did not produce an NSIS setup EXE." }
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $dist "Orange-Client-Setup.exe")

          $hashes = @()
          Get-ChildItem $dist -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            $hashes += "$hash  $($_.Name)"
          }
          $hashes | Set-Content -LiteralPath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii

      - name: Upload EXE files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Orange-Client-Windows-x64
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
          retention-days: 14
