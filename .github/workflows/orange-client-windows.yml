name: Orange Client Windows Build

on:
  push:
    branches: [main]
    paths:
      - "build/READY"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orange-client-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Orange Client for Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Orange Launcher 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Assemble Orange Client source
        shell: pwsh
        run: ./prepare-source.ps1

      - name: Generate Orange Client Windows icon
        working-directory: source
        run: python ../generate-icon.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "source -> target"

      - name: Test Windows account-data protection
        working-directory: source
        run: cargo test --locked -p oneclient_auth

      - name: Build portable launcher executable
        working-directory: source
        env:
          ORANGE_CLIENT_MICROSOFT_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_MICROSOFT_CLIENT_ID }}
          ORANGE_CLIENT_DISCORD_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_DISCORD_CLIENT_ID }}
          ORANGE_CLIENT_SENTRY_DSN: ${{ secrets.ORANGE_CLIENT_SENTRY_DSN }}
          ORANGE_CLIENT_CHANGELOG_URL: ${{ secrets.ORANGE_CLIENT_CHANGELOG_URL }}
        run: cargo build --locked --release -p oneclient_app --bin orange-client

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Create Windows setup installer
        working-directory: source
        env:
          ORANGE_CLIENT_MICROSOFT_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_MICROSOFT_CLIENT_ID }}
          ORANGE_CLIENT_DISCORD_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_DISCORD_CLIENT_ID }}
          ORANGE_CLIENT_SENTRY_DSN: ${{ secrets.ORANGE_CLIENT_SENTRY_DSN }}
          ORANGE_CLIENT_CHANGELOG_URL: ${{ secrets.ORANGE_CLIENT_CHANGELOG_URL }}
        run: cargo packager --release -p oneclient_app --formats nsis

      - name: Scan release files with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-Item "source/target/release/orange-client.exe"; Get-ChildItem "source/target/release/*-setup.exe" -File)
          if ($files.Count -lt 2) { throw "The portable app or setup installer is missing." }
          if (-not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) { throw "Microsoft Defender scan cmdlet is unavailable." }
          $scanStart = Get-Date
          foreach ($file in $files) {
            Write-Host "Scanning $($file.Name)..."
            Start-MpScan -ScanType CustomScan -ScanPath $file.FullName
          }
          $detections = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            $_.InitialDetectionTime -ge $scanStart -and (($_.Resources -join " ") -match "orange-client")
          }
          if ($detections) { throw "Microsoft Defender detected a threat in a release file. Nothing will be published." }
          Write-Host "No new Microsoft Defender detections for the release files."

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-Item "source/target/release/orange-client.exe"; Get-ChildItem "source/target/release/*-setup.exe" -File)
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding ascii

      - name: Upload portable executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orange-Client-Windows-x64-Portable
          path: source/target/release/orange-client.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orange-Client-Windows-x64-Setup
          path: source/target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orange-Client-Windows-x64-SHA256
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
