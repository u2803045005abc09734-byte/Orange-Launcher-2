name: Orange Client - Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "OrangeClient-source(2)-GitHub.zip"
      - "OrangeClient/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**"
      - "distribution/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orange-client-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Orange Launcher 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve project source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:GITHUB_WORKSPACE "OrangeClient-source(2)-GitHub.zip"
          $extract = Join-Path $env:RUNNER_TEMP "orange-client-source"

          if (Test-Path -LiteralPath $archive -PathType Leaf) {
            if (Test-Path -LiteralPath $extract) {
              Remove-Item -LiteralPath $extract -Recurse -Force
            }
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $project = Join-Path $extract "OrangeClient"
          }
          elseif (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "OrangeClient/Cargo.toml")) {
            $project = Join-Path $env:GITHUB_WORKSPACE "OrangeClient"
          }
          elseif (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "Cargo.toml")) {
            $project = $env:GITHUB_WORKSPACE
          }
          else {
            throw "No Orange Client source found. Expected OrangeClient-source(2)-GitHub.zip, OrangeClient/Cargo.toml, or Cargo.toml in the repository."
          }

          if (-not (Test-Path -LiteralPath (Join-Path $project "packages/oneclient_app/Cargo.toml") -PathType Leaf)) {
            throw "The selected source is missing packages/oneclient_app/Cargo.toml."
          }
          "path=$project" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using source: $project"

      - name: Install Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $makensis = Get-ChildItem "C:\Program Files (x86)\NSIS\makensis.exe" -ErrorAction SilentlyContinue
          if ($makensis) {
            Split-Path $makensis.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS installation failed; makensis.exe is unavailable."
          }

      - name: Install cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build Orange Client
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: cargo build --release -p oneclient_app

      - name: Bundle the Microsoft Visual C++ runtime
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: python distribution/windows/bundle-crt.py

      - name: Verify bundled runtime signatures
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dlls = @(Get-ChildItem "target/crt/*.dll" -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) { throw "No Microsoft VC++ runtime DLLs were staged." }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
              throw "Refusing to ship an unsigned or non-Microsoft runtime DLL: $($dll.Name)"
            }
          }

      - name: Create Windows installer
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        env:
          CI: "true"
        run: cargo packager --release -p oneclient_app --formats nsis --verbose

      - name: Prepare EXE downloads and checksums
        working-directory: ${{ steps.source.outputs.path }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $app = Join-Path (Get-Location) "target/release/oneclient_app.exe"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "Build did not produce target/release/oneclient_app.exe."
          }
          Copy-Item -LiteralPath $app -Destination (Join-Path $dist "Orange-Client-Portable.exe")

          $dlls = @(Get-ChildItem "target/crt/*.dll" -ErrorAction SilentlyContinue)
          if ($dlls.Count -gt 0) {
            $portableDir = Join-Path $dist "portable-files"
            New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
            Copy-Item -LiteralPath $app -Destination (Join-Path $portableDir "Orange-Client.exe")
            Copy-Item -LiteralPath $dlls.FullName -Destination $portableDir
            Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath (Join-Path $dist "Orange-Client-Portable-Files.zip") -Force
            Remove-Item -LiteralPath $portableDir -Recurse -Force
          }

          $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $setup) {
            $setup = Get-ChildItem "target/release/*setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $setup) { throw "cargo-packager did not produce an NSIS setup EXE." }
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $dist "Orange-Client-Setup.exe")

          $hashes = @()
          Get-ChildItem $dist -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            $hashes += "$hash  $($_.Name)"
          }
          $hashes | Set-Content -LiteralPath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Orange-Client-Windows-x64
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
          retention-days: 14
