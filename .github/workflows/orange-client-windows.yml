name: Orange Client - Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "source-payload/READY"
      - ".github/workflows/orange-client-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orange-client-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build-windows:
    name: Build Windows x64 from uploaded Orange Client source
    runs-on: windows-latest
    steps:
      - name: Checkout Orange Launcher 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch pinned OneLauncher base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:RUNNER_TEMP "OrangeClient"
          git clone --depth 1 --branch "oneclient-2.12.1" "https://github.com/Polyfrost/OneLauncher.git" $source
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch pinned OneLauncher base." }
          $commit = (git -C $source rev-parse HEAD).Trim()
          if ($commit -ne "1605bf11248f8cc94eacf8ff1f86981abcab8dc8") {
            throw "Unexpected upstream source revision: $commit"
          }
          "ORANGE_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified pinned upstream source: $commit"

      - name: Apply exact uploaded Orange Client source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c @'
          from pathlib import Path
          import base64, io, lzma, tarfile

          root = Path(".")
          parts = sorted((root / "source-payload").glob("part-*.b64"))
          if not parts:
              raise SystemExit("No uploaded source overlay parts found.")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive = lzma.decompress(base64.b64decode(encoded, validate=True))
          target = Path(__import__("os").environ["ORANGE_SOURCE"])
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  dest = (target / member.name).resolve()
                  if target.resolve() not in dest.parents:
                      raise SystemExit(f"Unsafe overlay path: {member.name}")
              tar.extractall(target)
          print(f"Applied {len(parts)} source payload parts.")
          '@

      - name: Install Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $makensis = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$makensis\makensis.exe") {
            $makensis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS installation failed."
          }

      - name: Install cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build Orange Client
        working-directory: ${{ runner.temp }}/OrangeClient
        shell: pwsh
        run: cargo build --release -p oneclient_app

      - name: Bundle Microsoft Visual C++ runtime
        working-directory: ${{ runner.temp }}/OrangeClient
        shell: pwsh
        run: python distribution/windows/bundle-crt.py

      - name: Package Windows installer
        working-directory: ${{ runner.temp }}/OrangeClient
        shell: pwsh
        env:
          CI: "true"
        run: cargo packager --release -p oneclient_app --formats nsis --verbose

      - name: Prepare EXE files and checksums
        working-directory: ${{ runner.temp }}/OrangeClient
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $app = "target/release/oneclient_app.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "Missing oneclient_app.exe after cargo build." }
          Copy-Item $app (Join-Path $dist "Orange-Client-Portable.exe")

          $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $setup) {
            $setup = Get-ChildItem "target/release/*setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $setup) { throw "NSIS installer was not produced by cargo-packager." }
          Copy-Item $setup.FullName (Join-Path $dist "Orange-Client-Setup.exe")

          $hashes = @()
          Get-ChildItem $dist -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            $hashes += "$hash  $($_.Name)"
          }
          $hashes | Set-Content (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows EXE downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Orange-Client-Windows-x64
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
          retention-days: 14
